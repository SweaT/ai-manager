spring:
  application:
    name: ai-manager
  main:
    web-application-type: reactive
  r2dbc:
    url: ${r2dbc.url}
    username: ${r2dbc.username}
    password: ${r2dbc.password}
  datasource:
    url: ${datasource.url}
    username: ${datasource.username}
    password: ${datasource.password}
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  ai:
    ollama:
      base-url: ${ai.ollama.base-url}
      chat:
        model: ${ai.ollama.chat.model}
      embedding:
        model: ${ai.ollama.embedding.model}

app:
  rag:
    top-k: 5
